# feishu-bridge 本地配置示例
#
# 用法：把下面这段拷进 ~/.dsh/profiles/desktop/cordis.patch.yml（追加到数组末尾），
# 或者作为独立文件保存。真实值只存在于 `~/.dsh/` 目录里，永远不进本仓库。
#
# 为什么放 profile 的 patch 层：bundle 层（项目里的 cordis.patch.yml）会随项目推送，
# 只能放占位符；profile 的 patch 层是用户本机配置，不会进 git，用它按同一个 id 覆盖 config。
#
# 取值规则（事实依据见 index.js 的 install() 里读 appId / chatId 的两段回退逻辑）：
#   config 里的 appId/chatId 一旦非空，环境变量就完全不参与，不是被环境变量覆盖；
#   只有 config 里为空（或缺失）时，才回退去读 FEISHU_BRIDGE_APP_ID / FEISHU_BRIDGE_CHAT_ID；
#   两者都空 → 桥接关闭并打 warn。
#   一句话：config 优先，环境变量只是 config 为空时的兜底，不存在反向覆盖。
#
# ⚠️ 下面 appId / chatId 故意留成空串，而不是写成「cli_your_app_id_here」这类非空占位符：
#    代码只判「是否非空」、不校验格式，照抄一个非空假值会被当成真值拿去做鉴权，
#    桥接不会报「未配置」，只会报鉴权失败，排错方向会被带偏。
#    留空 = 安全默认（桥接关闭 + 一条 warn）。要用时把值换成真值即可。
#    真实格式：appId 形如 cli_xxxxxxxxxxxxxxxx，chatId 形如 oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

- id: feishu-bridge
  name: feishu-bridge
  config:
    # 飞书自建应用 App ID（cli_ 开头）。留空则桥接不启动（只打 warn）。
    appId: ""
    # 飞书群 chat_id（oc_ 开头）。留空则桥接不启动（只打 warn）。
    chatId: ""
    # 要监听的飞书私聊 chat_id 列表（oc_ 开头），可选。
    # 飞书的会话列表接口只返回群、不返回私聊，所以每个私聊都必须写在这里；
    # 不填 = 只接群，私聊消息收不到（这是默认行为）。
    # 怎么拿到私聊 chat_id：先让机器人给你发一条私聊，POST /open-apis/im/v1/messages
    # （receive_id_type=open_id）的响应里 data.chat_id 就是。详见 README「私聊」一节。
    # 需要额外权限 im:message.p2p_msg:readonly。
    # 也可用环境变量 FEISHU_BRIDGE_DIRECT_CHAT_IDS（逗号分隔），那种方式不进仓库。
    #directChatIds:
    #  - oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # 存 App Secret 的凭据条目名（DSH 凭据库里的 ref 名，不是环境变量名）。
    # 可省略，省略时默认 FEISHU_APP_SECRET。
    secretName: FEISHU_APP_SECRET
    pollSeconds: 10
    # 群图片归档目录（可选）。省略时默认 ~/.dsh/Pic；每张图片只写到这一个目录。
    # 想让图片落在别处（例如原来的 D:\Code\Life\Pic）就取消注释并改值：
    #picDir: D:\Code\Life\Pic
